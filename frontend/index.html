<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo-zapilar.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B2B26" />

  <!-- SEO & WhatsApp Sharing Meta Tags -->
  <title>Zapilar - Gestão Imobiliária Inteligente</title>
  <meta name="description"
    content="Zapilar - A plataforma completa para corretores e imobiliárias. Gestão de imóveis, CRM, automação de WhatsApp e consultas integradas." />

  <!-- Facebook / WhatsApp / LinkedIn -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://zapilar.online/" />
  <meta property="og:title" content="Zapilar - Gestão Imobiliária Inteligente" />
  <meta property="og:description"
    content="A plataforma completa para corretores e imobiliárias. Gestão, CRM e Automação." />
  <meta property="og:image" content="https://zapilar.online/logo-zapilar.svg" />
  <meta property="og:image:width" content="300" />
  <meta property="og:image:height" content="300" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://zapilar.online/" />
  <meta property="twitter:title" content="Zapilar - Gestão Imobiliária Inteligente" />
  <meta property="twitter:description"
    content="A plataforma completa para corretores e imobiliárias. Gestão, CRM e Automação." />
  <meta property="twitter:image" content="https://zapilar.online/logo-zapilar.svg" />

  <link rel="apple-touch-icon" href="/logo-zapilar.svg">
</head>

<body>
  <div id="root">
    <!-- Pre-loader Premium -->
    <div id="initial-loader" style="
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0B2B26;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: sans-serif;
    ">
      <div style="position: relative; width: 80px; height: 80px;">
        <img src="/logo-zapilar.svg" alt="Zapilar"
          style="width: 100%; height: 100%; object-fit: contain; animation: pulse 2s infinite ease-in-out;" />
        <div style="
          position: absolute;
          top: -10px;
          left: -10px;
          right: -10px;
          bottom: -10px;
          border: 2px solid rgba(255,255,255,0.1);
          border-top: 2px solid #22c55e;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        "></div>
      </div>
      <h2 style="color: white; margin-top: 24px; font-weight: 700; letter-spacing: 2px; font-size: 18px;">ZAPILAR</h2>
      <div
        style="width: 150px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-top: 12px; overflow: hidden;">
        <div
          style="width: 30%; height: 100%; background: #22c55e; border-radius: 10px; animation: loading-bar 2s infinite ease-in-out;">
        </div>
      </div>
    </div>

    <style>
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0% {
          opacity: 0.5;
          transform: scale(0.95);
        }

        50% {
          opacity: 1;
          transform: scale(1.05);
        }

        100% {
          opacity: 0.5;
          transform: scale(0.95);
        }
      }

      @keyframes loading-bar {
        0% {
          transform: translateX(-100%);
        }

        50% {
          transform: translateX(100%);
        }

        100% {
          transform: translateX(-100%);
        }
      }
    </style>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
